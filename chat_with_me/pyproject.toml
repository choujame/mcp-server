[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "social-persona-skill"
version = "0.1.0"
description = "Minimal persona distillation scaffold with equal-priority multi-platform live smoke tests."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.28",
]

[project.scripts]
social-persona-skill = "social_persona_skill.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
